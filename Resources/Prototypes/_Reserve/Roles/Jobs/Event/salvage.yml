- type: job
  id: SalvageCentcom #event role
  name: job-name-salvagecentcom
  description: job-description-salvagecentcom
  playTimeTracker: JobSalvageSpecialistCentcom
  setPreference: false
  startingGear: SalvageCentcomGear
  icon: "JobIconShaftMiner"
  supervisors: job-supervisors-commander
  canBeAntag: false
  access: #no AA, only cargo + CC access. Role anyway gets Executive ID Card for AA.
  - Cargo
  - Maintenance
  - Salvage
  - External
  - Command
  - Brig
  - CentralCommand
  special:
  - !type:AddImplantSpecial
    implants: [ FreedomImplant, BluespaceLifelineImplant, RadioImplantCentcomm, NutrimentPumpImplant, StypticStimulatorImplant ]
  - !type:AddComponentSpecial
    components:
    - type: GrantCqc
      startingStage: Hard
      isBlocked: false

- type: startingGear
  id: SalvageCentcomGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitSalvageSpecialist
