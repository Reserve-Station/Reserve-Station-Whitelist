    gloves: ClothingHandsMercGlovesCombat
    outerClothing: ClothingOuterArmorBasic #just for style
    suitstorage: WeaponShotgunEnforcer
    shoes: ClothingShoesBootsMagEmergencyResponseTeam
    head: ClothingHeadBandMerc
    id: SalvagePDA
    belt: ClothingBeltSalvageWebbingSalvageCCFilled
    pocket1: WeaponCrusherDagger
    pocket2: WeaponGrapplingGun
