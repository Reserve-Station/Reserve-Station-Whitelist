### ERT covert leader (Syndicate role)
- type: entity
  name: covert ERT leader spawner
  id: ERTLeaderCovertSpawner
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: red
      - sprite: Structures/Decoration/banner.rsi
        state: banner_syndicate
  - type: RandomSpawner
    prototypes:
    - RandomHumanoidERTLeaderCovert

- type: entity
  id: RandomHumanoidERTLeaderCovert
  name: covert ERT leader ghost role
  components:
    - type: Sprite
      sprite: Structures/Decoration/banner.rsi
      state: banner_syndicate
    - type: RandomHumanoidSpawner
      settings: ERTLeaderCovert

- type: randomHumanoidSettings
  id: ERTLeaderCovert
  parent: EventHumanoid
  speciesBlacklist:
  - Monkey
  - Kobold
  - Abductor
  - Yowie
  - IPC
  - Diona
  - Vox # Sprites look shit on them.
  - Gingerbread
  - Oni
  components:
    - type: AutoImplant
      implants: [ FakeMindShieldImplant, FreedomImplant, RadioImplant, MicroBombImplant, DeathRattleImplant ]
    - type: NpcFactionMember
      factions:
      - Syndicate
    - type: NukeOperative
    - type: GhostRole
      name: ghost-role-information-ert-covert-leader-name
      description: ghost-role-information-ert-covert-leader-description
      rules: ghost-role-information-rules-team-antagonist
      mindRoles:
      - MindRoleGhostRoleTeamAntagonist
      raffle:
        settings: default
      requirements:
      - !type:DepartmentTimeRequirement
        department: Command
        time: 18000 # 5h
    - type: Loadout
      prototypes: [ ERTLeaderCovertGearFull ]
      roleLoadout: [ RoleSurvivalSyndicate ]

